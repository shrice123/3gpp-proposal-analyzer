name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Installer kind
        required: true
        type: choice
        options: [online, offline, both]
        default: both
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROPOSAL_UPDATE_URL: ${{ vars.PROPOSAL_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - name: Test backend
        shell: bash
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - name: Build renderer
        run: npm run build:renderer
      - name: Build backend sidecar
        working-directory: backend
        run: pyinstaller --clean proposal-backend.spec
      - name: Build online installer
        if: ${{ github.event_name == 'push' || inputs.release_kind == 'online' || inputs.release_kind == 'both' }}
        run: npx electron-builder --config electron-builder.online.yml --${{ matrix.arch }} --publish never
      - name: Build offline installer
        if: ${{ github.event_name == 'push' || inputs.release_kind == 'offline' || inputs.release_kind == 'both' }}
        run: npx electron-builder --config electron-builder.offline.yml --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
