services:
  backend:
    build: ./backend
    environment:
      PROPOSAL_TOOL_DATA_DIR: /data
    volumes:
      - proposal-data:/data
    ports:
      - "127.0.0.1:8765:8765"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8765
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  proposal-data:

